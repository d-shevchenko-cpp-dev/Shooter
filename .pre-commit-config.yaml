# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.2
    hooks:
      - id: clang-format
        args: [--style=file]
        types_or: [c, c++, header]
        exclude: ^(Binaries/|Intermediate/|Saved/|DerivedDataCache/|Plugins/.*/Intermediate/|.*\.uproject$|.*\.sln$)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(Binaries/|Intermediate/|Saved/|DerivedDataCache/|.*\.DotSettings\.user$|.*\.sln$|.*\.uproject$)
      - id: trailing-whitespace
        # exclude: ^(Binaries/|Intermediate/|Saved/|DerivedDataCache/|.*\.DotSettings\.user$|.*\.sln$|.*\.uproject$)
